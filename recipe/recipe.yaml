schema_version: 1

context:
  version: "0.18.0"

package:
  name: go-fq
  version: ${{ version }}

source:
  url: https://github.com/wader/fq/archive/v${{ version }}.tar.gz
  sha256: 2580de6fb21281a262f99f24d585a925cef71f158c2b24a34125e1b29bc612ef

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - fq --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: jq for binary formats
  homepage: https://github.com/wader/fq
  repository: https://github.com/wader/fq

extra:
  feedstock_name:
    - fq
  recipe-maintainers:
    - danielnachun
