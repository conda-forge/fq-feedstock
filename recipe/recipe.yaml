schema_version: 1

context:
  version: "0.17.0"

package:
  name: go-fq
  version: ${{ version }}

source:
  url: https://github.com/wader/fq/archive/v${{ version }}.tar.gz
  sha256: c5658b2bc635a1d344c64e37d7311157f0fc4b20cc3cfa4d09bdd2f023692d57

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - fq --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: jq for binary formats
  homepage: https://github.com/wader/fq
  repository: https://github.com/wader/fq

extra:
  feedstock_name:
    - fq
  recipe-maintainers:
    - danielnachun
