schema_version: 1

context:
  version: 0.15.1

package:
  name: fq
  version: ${{ version }}

source:
  url: https://github.com/wader/fq/archive/v${{ version }}.tar.gz
  sha256: 9f668394c33f3effd02b7d7a145f1087ce784e01d3d0c6e6ba41a899d5e349a7

build:
  number: 1

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - fq --help

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: jq for binary formats
  homepage: https://github.com/wader/fq
  repository: https://github.com/wader/fq

extra:
  recipe-maintainers:
    - danielnachun
